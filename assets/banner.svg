  <ellipse cx="930" cy="150" rx="300" ry="170" fill="url(#glow)"/>

  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#7dd3fc" opacity="0.14">
    <text x="60" y="30">def predict(model, X):</text>
    <text x="360" y="285">model.fit(X_train, y_train)</text>
    <text x="520" y="40">import sklearn</text>
    <text x="600" y="270">api.post("/predict")</text>
  </g>

